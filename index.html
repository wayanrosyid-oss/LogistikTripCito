<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Belanja Logistik Trip Cito</title>
<meta name="description" content="Checklist logistik perjalanan Belanja Logistik Trip Cito dengan riwayat trip, export PDF, dan penyimpanan offline">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#061417">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg: #061417;
    --bg-soft: #0a2427;
    --paper: rgba(10,36,39,.78);
    --paper-dim: rgba(255,255,255,.04);
    --ink: #eaf6f5;
    --ink-soft: #8fb4b2;
    --orange: #25cfc4;
    --orange-deep: #12b3a8;
    --orange-soft: rgba(37,207,196,0.14);
    --green: #56e4a5;
    --green-deep: #1f9d6b;
    --green-soft: rgba(86,228,165,0.14);
    --red: #ff8a80;
    --red-soft: rgba(255,107,107,0.12);
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.18);
    --radius: 22px;
    --font-display: Arial, Helvetica, sans-serif;
    --font-body: Arial, Helvetica, sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    transition: background-color 0.25s ease;
    overflow-x: hidden;
  }
  body[data-trip-type="privat"]{
    --accent: var(--orange); --accent-deep: var(--orange-deep); --accent-soft: var(--orange-soft);
    --glow-1: rgba(37,207,196,.42); --glow-2: rgba(18,179,168,.32);
    --scene-core: rgba(24,113,110,.55);
  }
  body[data-trip-type="open"]{
    --accent: var(--green); --accent-deep: var(--green-deep); --accent-soft: var(--green-soft);
    --glow-1: rgba(86,228,165,.42); --glow-2: rgba(31,157,107,.32);
    --scene-core: rgba(28,110,72,.55);
  }

  /* ===== Animated background (decorative only) ===== */
  .bg-scene{
    position: fixed; inset: 0; overflow: hidden; z-index: -5;
    background:
      radial-gradient(circle at 50% 20%, var(--scene-core, #16464b) 0%, transparent 50%),
      linear-gradient(180deg, #071c20, #030b0d);
    transition: background .4s ease;
  }
  .bg-glow{
    position:absolute; width:560px; height:560px; border-radius:50%;
    background: var(--glow-1, rgba(0,210,190,.12)); filter: blur(70px);
    animation: bgGlowMove 8s ease-in-out infinite alternate;
    transition: background-color .4s ease;
  }
  .bg-glow.one{ top:-150px; left:-100px; }
  .bg-glow.two{ bottom:-200px; right:-100px; animation-delay:3s;
    background: var(--glow-2, rgba(37,207,196,.10));
  }
  @keyframes bgGlowMove{ from{ transform: translate(0,0) scale(1);} to{ transform: translate(100px,50px) scale(1.25);} }
  .bg-topo{
    position:absolute; inset:-20%; opacity:.10;
    background: repeating-radial-gradient(ellipse at center, transparent 0px, transparent 35px, #7ce8df 37px, transparent 40px);
    animation: bgTopoMove 30s linear infinite;
  }
  @keyframes bgTopoMove{ from{ transform: rotate(0deg) scale(1);} to{ transform: rotate(360deg) scale(1.15);} }
  .bg-mountains{ position:absolute; bottom:-10px; width:100%; height:230px; }
  .bg-mountain{ position:absolute; bottom:0; width:0; height:0; border-left:180px solid transparent; border-right:180px solid transparent; border-bottom:260px solid #0b292c; }
  .bg-mountain:nth-child(1){ left:-120px; }
  .bg-mountain:nth-child(2){ left:25%; transform: scale(1.3); border-bottom-color:#092326; }
  .bg-mountain:nth-child(3){ right:-100px; transform: scale(.9); border-bottom-color:#0d3033; }
  .bg-particle{ position:absolute; width:3px; height:3px; background:#7ce8df; border-radius:50%; opacity:.6; animation: bgFloatParticle linear infinite; }
  @keyframes bgFloatParticle{ from{ transform: translateY(100vh); opacity:0;} 20%{opacity:.7;} 80%{opacity:.7;} to{ transform: translateY(-20vh); opacity:0;} }

  /* ===== Progress bar (sticky, always on top) ===== */
  .progress-sticky{
    background: rgba(6,20,23,.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--ink);
    position: sticky;
    top: 0;
    z-index: 32;
    padding: max(10px, env(safe-area-inset-top)) 20px 10px;
    display: none;
    border-bottom: 1px solid var(--line);
  }
  .progress-sticky-inner{ max-width: 640px; margin: 0 auto; }
  .progress-sticky .toolbar{ margin-top: 10px; margin-bottom: 0; }
  @media (min-width: 640px){ .progress-sticky{ padding-left:0; padding-right:0; } }

  /* ===== Header (brand + tabs, scrolls away with the page) ===== */
  header{
    background: rgba(6,20,23,.9);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: var(--ink);
    padding: max(12px, env(safe-area-inset-top)) 20px 14px;
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .brand::before{
    content: "🏔️"; font-size: 22px; width:40px; height:40px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--accent, #1ec8bd), var(--accent-deep, #08746f));
    box-shadow: 0 8px 22px var(--accent-soft, rgba(30,200,189,.25)); flex-shrink:0;
    transition: background .3s ease, box-shadow .3s ease;
  }
  .brand-text{ display:flex; flex-direction:column; gap:2px; }
  .brand-eyebrow{ font-size: 11px; color: var(--orange-deep); font-weight:700; }
  h1{ font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; line-height: 1.2; color: var(--ink); }

  /* Content that scrolls away with the page (not sticky) */
  .scroll-top-panel{
    background: transparent;
    color: var(--ink);
    padding: 14px 20px 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  @media (min-width: 640px){ .scroll-top-panel{ padding-left:0; padding-right:0; } }

  .trip-type-row{ margin-bottom: 12px; }
  /* ===== Filter Switch (segmented radio + sliding highlight) ===== */
  .filter-switch{
    --pad: 4px;
    position: relative; display: flex; align-items: stretch;
    padding: var(--pad); border-radius: 16px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.28);
    isolation: isolate;
  }
  .filter-switch.pill{ border-radius: 999px; }
  .filter-switch input{ position:absolute; opacity:0; width:0; height:0; margin:0; pointer-events:none; }
  .filter-switch .option{
    flex: 1; position: relative; z-index: 2;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding: 10px 0; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    font-family: var(--font-body); cursor:pointer; user-select:none; -webkit-user-select:none;
    border-radius: 12px; transition: color .25s ease;
  }
  .filter-switch.pill .option{ font-size: 13.5px; border-radius: 999px; }
  .filter-switch .option svg{ width:14px; height:14px; }
  .filter-switch input:checked + .option{ color:#03201e; }
  .filter-switch input:not(:checked) + .option:hover{ color: var(--ink); }
  .filter-switch .background{
    position:absolute; z-index:1; top: var(--pad); bottom: var(--pad); left: var(--pad);
    width: calc((100% - var(--pad) * 2) / 2);
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    box-shadow: 0 0 16px var(--glow-2), 0 6px 18px var(--accent-soft);
    transition: transform .35s cubic-bezier(.4,0,.2,1), background .3s ease, box-shadow .3s ease;
  }
  .filter-switch.pill .background{ border-radius: 999px; }
  .filter-switch input:nth-of-type(2):checked ~ .background{ transform: translateX(100%); }
  .filter-switch input:focus-visible + .option{ outline: 2px solid var(--accent); outline-offset: -2px; }

  .trip-name-row{ margin-bottom: 14px; padding: 20px; border-radius: 23px;
    background: rgba(8,31,34,.72); border: 1px solid var(--accent-soft, var(--line));
    border-left: 3px solid var(--accent, var(--line));
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0,0,0,.28);
    animation: heroFloat 6s ease-in-out infinite;
    transition: border-color .3s ease;
  }
  .trip-name-fields{ display:flex; gap:10px; }
  .trip-name-field{ flex:1; min-width:0; }
  .trip-name-field.date-field{ flex:0 0 148px; }
  @keyframes heroFloat{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }
  .trip-name-row label{
    display:block; font-size: 11px; font-weight: 700; color: var(--ink-soft);
    letter-spacing: 0.02em; margin-bottom: 8px;
  }
  .trip-name-input{
    width: 100%;
    background: rgba(0,0,0,.25);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 13px 14px;
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
  }
  .trip-name-input::placeholder{ color: rgba(234,246,245,0.35); font-weight: 400; }
  .trip-name-input:focus{ outline: none; border-color: var(--accent, var(--orange)); box-shadow: 0 0 0 3px var(--accent-soft, rgba(37,207,196,.12)); }
  input[type="date"].trip-name-input{ color-scheme: dark; padding: 12px 10px; font-size: 14.5px; }
  @media(max-width:380px){
    .trip-name-fields{ flex-direction:column; }
    .trip-name-field.date-field{ flex:1 1 auto; }
  }

  /* Tabs (memakai .filter-switch.pill) */
  .tabs{ margin-bottom: 10px; }

  .progress-wrap{ margin-bottom: 0; }
  .progress-total-price{
    font-size: 12.5px; font-weight: 700; color: var(--accent, var(--orange)); text-align:right;
    margin-top: 6px; min-height: 1px;
  }
  .progress-label{
    display:flex; justify-content:space-between; font-size: 13px;
    color: var(--ink-soft); margin-bottom: 6px; font-variant-numeric: tabular-nums;
  }
  .progress-track{ height: 8px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
  .progress-fill{
    height: 100%; background: linear-gradient(90deg, var(--accent, #25cfc4), var(--accent-deep, #56e4a5));
    border-radius: 6px; transition: width 0.35s ease, background .3s ease; width: 0%;
  }

  .toolbar{ display:flex; gap:8px; margin-bottom: 4px; position:relative; }
  .search-input{
    flex:1; background: rgba(0,0,0,.25); border: 1px solid var(--line);
    border-radius: 13px; padding: 12px 14px; color: var(--ink);
    font-family: var(--font-body); font-size: 14.5px;
  }
  .search-input::placeholder{ color: rgba(234,246,245,0.35); }
  .search-input:focus{ outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(37,207,196,.12); }

  .toolbar-icon-btn{
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 13px;
    background: rgba(0,0,0,.25); border: 1px solid var(--line);
    color: var(--ink-soft); cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .toolbar-icon-btn svg{ width:18px; height:18px; }
  .toolbar-icon-btn.active{ background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: transparent; color: #03201e; }
  .toolbar-icon-btn .dot{
    position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%;
    background: var(--orange); display:none;
  }
  .toolbar-icon-btn.has-filter .dot{ display:block; }
  .toolbar-icon-btn.active .dot{ display:none; }

  .filter-popover{
    position: absolute; right: 0; top: 50px; background: #0d2b2e;
    border: 1px solid var(--line);
    border-radius: 16px; padding: 6px; box-shadow: 0 15px 40px rgba(0,0,0,.4);
    z-index: 45; min-width: 200px;
    opacity: 0; transform: translateY(-6px) scale(.97); pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .filter-popover.show{ opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .filter-option{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 11px 12px; border-radius: 10px; cursor:pointer; font-size: 14px; color: var(--ink); font-weight:500;
  }
  .filter-option:active{ background: rgba(255,255,255,.06); }
  .filter-option-check{
    width:20px; height:20px; border-radius:6px; border:2px solid rgba(86,228,165,.4);
    background: rgba(0,0,0,.25); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, border-color .2s ease, box-shadow .25s ease;
  }
  .filter-option-check svg{
    width:12px; height:12px; opacity:0; stroke-dasharray:24; stroke-dashoffset:24;
    transition: stroke-dashoffset .25s ease .05s, opacity .1s ease;
  }
  .filter-option.on .filter-option-check{
    background: var(--green); border-color: var(--green);
    box-shadow: 0 0 12px rgba(86,228,165,.6), 0 0 24px rgba(86,228,165,.25);
  }
  .filter-option.on .filter-option-check svg{ opacity:1; stroke-dashoffset:0; }

  /* ===== Main list ===== */
  main{ padding: 8px 14px 12px; max-width: 640px; margin: 0 auto; }
  @keyframes contentFadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform: translateY(0);} }
  /* Animasi fade dihapus agar daftar tidak berkedip saat state berubah. */

  .category{
    background: rgba(10,36,39,.78);
    border: 1px solid var(--line);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-radius: var(--radius); margin-bottom: 14px;
    overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,.22);
  }
  .category-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding: 15px 8px 15px 17px; background: none; border: none; text-align:left; cursor:pointer; gap:6px;
  }
  .category-head-left{ display:flex; align-items:baseline; gap:9px; min-width:0; flex:1; }
  .category-name{ font-family: var(--font-display); font-size: 16.5px; font-weight: 700; color: var(--ink); word-break:break-word; }
  .category-count{ font-size: 12px; color: var(--ink-soft); font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink:0; }
  .category-head-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-btn{
    width: 34px; height:34px; border:none; background:none; color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:9px; flex-shrink:0;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:active{ background: rgba(255,255,255,.08); }
  .icon-btn.danger-hover:active{ background: var(--red-soft); color: var(--red); }
  .icon-btn svg{ width:15px; height:15px; }
  .category-body{
    border-top: 1px solid var(--line);
    overflow: hidden;
    max-height: 2400px;
    opacity: 1;
    transition: max-height .32s cubic-bezier(.4,0,.2,1), opacity .22s ease, border-color .32s ease;
  }
  .category.collapsed .category-body{
    max-height: 0;
    opacity: 0;
    border-top-color: transparent;
    transition: max-height .28s cubic-bezier(.4,0,.2,1), opacity .18s ease, border-color .28s ease;
  }
  .category{ transition: box-shadow .2s ease; }

  .item{ padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .item:last-child{ border-bottom:none; }
  .item.hidden{ display:none; }
  .item-row-main{ display:flex; align-items:center; gap:11px; }

  /* ===== Neon Checkbox ===== */
  .checkbox-wrapper{
    position: relative; display:inline-flex; flex-shrink:0; cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .checkbox-wrapper input{
    position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; z-index:1;
  }
  .checkmark{
    width: 26px; height: 26px; border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    color:#03201e;
    border: 2px solid rgba(86,228,165,.4);
    background: rgba(0,0,0,.25);
    box-shadow: inset 0 0 6px rgba(86,228,165,.08);
    transition: background .2s ease, border-color .2s ease, box-shadow .25s ease, transform .15s ease;
  }
  .checkmark svg{
    width: 15px; height: 15px; opacity:0;
    stroke-dasharray: 24; stroke-dashoffset: 24;
    transition: stroke-dashoffset .25s ease .05s, opacity .1s ease;
  }
  .checkbox-wrapper:hover .checkmark{ border-color: var(--green); box-shadow: 0 0 10px rgba(86,228,165,.35); }
  .checkbox-wrapper:active .checkmark{ transform: scale(.9); }
  .checkbox-wrapper input:checked + .checkmark{
    background: var(--green); border-color: var(--green);
    box-shadow: 0 0 14px rgba(86,228,165,.65), 0 0 28px rgba(86,228,165,.28);
  }
  .checkbox-wrapper input:checked + .checkmark svg{ opacity:1; stroke-dashoffset:0; }
  .checkbox-wrapper input:focus-visible + .checkmark{ outline: 2px solid var(--green); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce){
    .checkmark, .checkmark svg, .filter-switch .background, .filter-switch .option{ transition: none; }
  }

  .item-name{ flex: 1; font-size: 15px; font-weight: 500; color: var(--ink); cursor: pointer; user-select: none; min-width:0; word-break:break-word; }
  .item.checked .item-name{ color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line-strong); }


  .plus-tag{
    font-size: 10px; font-weight: 700; color: var(--orange-deep); background: var(--orange-soft);
    padding: 2px 6px; border-radius: 6px; flex-shrink: 0; margin-left: 6px;
  }

  .qty-stepper{ display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .qty-btn{
    width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: rgba(255,255,255,.05); color: var(--ink); font-size: 15px; font-weight: 700;
    display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1;
    font-family: var(--font-body); padding:0;
  }
  .qty-btn:active{ background: rgba(255,255,255,.1); }
  .qty-val{ min-width: 20px; text-align:center; font-size: 13.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  .item-manage-delete{ flex-shrink:0; width:26px; height:26px; }

  .item-row-price{ display:flex; align-items:center; gap:8px; margin-top: 9px; padding-left: 36px; }
  .item-row-price label{ font-size: 11.5px; color: var(--ink-soft); font-weight: 600; flex-shrink:0; }
  .price-input{
    flex:1; max-width: 160px; background: rgba(0,0,0,.25); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 13.5px; color: var(--ink); font-family: var(--font-body);
  }
  .price-input:focus{ outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(37,207,196,.12); }

  .manage-toggle-btn{
    font-size: 11px; font-weight: 700; color: var(--ink-soft); background: rgba(255,255,255,.06);
    border: none; padding: 6px 9px; border-radius: 8px; cursor:pointer; font-family: var(--font-body);
    flex-shrink:0; white-space:nowrap;
  }
  .manage-toggle-btn.active{ background: var(--red-soft); color: var(--red); }

  /* Edit row (inline rename) */
  .edit-row{ display:flex; align-items:center; gap:6px; flex:1; }
  .edit-row input{
    flex:1; font-size:14.5px; padding:8px 10px; border:1.5px solid var(--orange);
    border-radius:9px; color:var(--ink); background: rgba(0,0,0,.3); min-width:0; font-family: var(--font-body);
  }
  .edit-row button{ border:none; font-size:12px; font-weight:700; padding:8px 12px; border-radius:9px; cursor:pointer; flex-shrink:0; font-family: var(--font-body); }
  .edit-save{ background: linear-gradient(135deg,#7cf0af,#1f9d6b); color:#03201e; }
  .edit-cancel{ background: rgba(255,255,255,.1); color:var(--ink-soft); }

  /* add item row */
  .add-item-row{ display:flex; gap:8px; padding: 10px 16px 14px; }
  .add-item-input{
    flex:1; border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: var(--font-body); background: transparent; color: var(--ink);
  }
  .add-item-input::placeholder{ color: var(--ink-soft); }
  .add-item-input:focus{ outline: none; border-color: var(--orange); }
  .add-item-btn{
    border: none; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #03201e; border-radius: 10px;
    padding: 0 15px; font-size: 13.5px; font-weight: 700; font-family: var(--font-body); cursor:pointer; white-space:nowrap;
  }

  .empty-msg{ padding: 14px 16px; text-align:center; font-size: 13px; color: var(--ink-soft); }

  /* add category */
  .add-category{
    background: rgba(8,31,34,.6); border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
    padding: 16px; display:flex; gap:8px; margin-top: 4px; margin-bottom: 20px;
  }
  .add-category-input{
    flex:1; background: transparent; border: none; border-bottom: 1.5px solid var(--line-strong);
    color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 6px 2px;
  }

  .add-category-input:focus{ outline:none; border-bottom-color: var(--orange); }
  .add-category-btn{
    border: none; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #03201e; border-radius: 10px;
    padding: 0 16px; font-size: 14px; font-weight: 700; font-family: var(--font-body); cursor:pointer;
  }

  /* ===== History tab ===== */
  .history-empty{ text-align:center; color: var(--ink-soft); padding: 48px 20px; font-size: 14px; }
  .history-card{
    background: rgba(10,36,39,.78); border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-radius: var(--radius); margin-bottom: 10px; overflow:hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.22);
  }
  .history-card.type-privat{ border-left-color: var(--orange); }
  .history-card.type-open{ border-left-color: var(--green); }
  .history-head{
    display:flex; align-items:center; justify-content:space-between; padding: 14px 8px 14px 16px; cursor:pointer; gap:8px;
  }
  .history-info{ min-width:0; flex:1; }
  .history-title{ font-family: var(--font-display); font-size: 15.5px; font-weight: 700; word-break:break-word; color: var(--ink); }
  .history-date{ font-size: 12px; color: var(--ink-soft); margin-top: 4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .history-badge{
    font-size: 11.5px; font-weight: 700; color: #03201e; background: var(--green);
    padding: 3px 9px; border-radius: 999px; flex-shrink:0; white-space:nowrap;
  }
  .history-type-badge{
    font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; flex-shrink:0; white-space:nowrap;
  }
  .history-type-badge.privat{ color: #03201e; background: var(--orange); }
  .history-type-badge.open{ color: #03201e; background: var(--green); }
  .history-actions{ display:flex; gap:0px; flex-shrink:0; align-items:center; }
  .history-body{ padding: 0 16px 14px; border-top: 1px solid var(--line); display:none; }
  .history-card.open .history-body{ display:block; padding-top: 12px; }
  .history-cat{ margin-bottom: 10px; }
  .history-cat-title{
    font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
    letter-spacing: 0.03em; margin-bottom: 5px;
  }
  .history-item{ font-size: 13.5px; padding: 3px 0; display:flex; gap:7px; align-items:flex-start; color: var(--ink); }
  .history-item .mark{ flex-shrink:0; width:16px; }
  .history-item.done{ color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line-strong); }

  /* ===== Bottom action bar (part of normal page flow, not floating) ===== */
  .bottom-bar{
    position: relative; background: rgba(6,25,27,.88);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line); border-radius: 22px;
    padding: 9px; max-width: 480px; width: calc(100% - 32px); margin: 4px auto 24px;
    display:flex; gap:8px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
  }
  .bar-btn{
    flex:1; border: none; border-radius: 15px; padding: 12px 6px;
    font-family: var(--font-body); font-size: 12.5px; font-weight: 700;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    transition: transform .2s;
  }
  .bar-btn:active{ transform: scale(.96); }
  .bar-btn svg{ width:19px; height:19px; }
  .bar-btn.neutral{ background: rgba(255,255,255,.06); color: var(--ink-soft); }
  .bar-btn.finish{ background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #03201e; box-shadow: 0 10px 25px var(--accent-soft); transition: background .3s ease, transform .2s; }

  /* More sheet */
  .sheet-backdrop{
    position: fixed; inset:0; background: rgba(0,0,0,0.55); z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .sheet-backdrop.show{ opacity: 1; pointer-events: auto; }
  .sheet{
    position: fixed; left:0; right:0; bottom:0; background: #0a2427;
    border: 1px solid var(--line); border-bottom:none;
    border-radius: 24px 24px 0 0; z-index: 61; padding: 8px 8px max(16px, env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.25s ease;
    max-width: 640px; margin: 0 auto;
  }
  .sheet-backdrop.show .sheet{ transform: translateY(0); }
  .sheet-handle{ width:36px; height:4px; background: var(--line-strong); border-radius:2px; margin: 8px auto 10px; }
  .sheet-title{ font-family: var(--font-display); font-size: 13px; font-weight:700; color: var(--ink-soft); letter-spacing:0.04em; padding: 4px 14px 8px; }
  .sheet-action{
    width:100%; display:flex; align-items:center; gap:13px; padding: 13px 14px;
    background:none; border:none; text-align:left; font-size: 15px; font-weight:500; color: var(--ink);
    border-radius: 12px; cursor:pointer; font-family: var(--font-body);
  }
  .sheet-action:active{ background: rgba(255,255,255,.06); }
  .sheet-action svg{ width:19px; height:19px; color: var(--ink-soft); flex-shrink:0; }
  .sheet-action.danger{ color: var(--red); }
  .sheet-action.danger svg{ color: var(--red); }
  .sheet-divider{ height:1px; background: var(--line); margin: 6px 8px; }

  .empty-state{ text-align:center; color: var(--ink-soft); padding: 40px 20px; font-size: 14px; }

  .toast{
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(10px);
    background: #0a2427; border: 1px solid var(--line); color: var(--ink); padding: 10px 18px; border-radius: 13px;
    font-size: 13.5px; font-weight: 500; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none; z-index: 50; max-width: 90vw; text-align:center;
    box-shadow: 0 15px 30px rgba(0,0,0,.35);
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Install App banner */
  .install-banner{
    display:none; align-items:center; gap:12px;
    background: rgba(8,31,34,.72); border: 1px solid var(--line);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-radius: var(--radius); padding: 12px 14px; margin: 0 0 14px;
  }
  .install-banner.show{ display:flex; }
  .install-banner-icon{
    width:38px; height:38px; border-radius:11px; flex-shrink:0; object-fit:cover;
  }
  .install-banner-text{ flex:1; min-width:0; }
  .install-banner-title{ font-size:13.5px; font-weight:700; color: var(--ink); line-height:1.25; }
  .install-banner-sub{ font-size:11.5px; color: var(--ink-soft); margin-top:1px; }
  .install-banner-btn{
    border:none; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#03201e; font-family: var(--font-body);
    font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:11px; cursor:pointer; flex-shrink:0;
  }
  .install-banner-close{
    border:none; background:none; color: var(--ink-soft); cursor:pointer; padding:4px; flex-shrink:0;
  }
  .install-banner-close svg{ width:16px; height:16px; display:block; }

  @media (min-width: 640px){
    header{ padding-left: 24px; padding-right: 24px; }
    main{ padding-left: 0; padding-right: 0; }
  }

  @media(max-width:360px){
    h1{ font-size: 16px; }
  }

  /* =====================================================================
     VERSI ANIMASI — efek klik unik + api di progress bar
     ===================================================================== */

  /* ---- Api pada progress bar ---- */
  .progress-track-wrap{ position: relative; }
  #fire-canvas{
    position:absolute; left:0; bottom:0; width:100%; height:64px;
    pointer-events:none; z-index:1;
  }
  .progress-label{ position: relative; z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,.65); }
  .progress-track{ position: relative; z-index: 0; height: 9px; }
  .progress-fill{
    background: linear-gradient(90deg, #ff6a00, #ff3d00 55%, #ffcf33);
    box-shadow: 0 0 calc(4px + 22px * var(--heat, 0)) rgba(255,110,20, calc(.25 + .6 * var(--heat, 0)));
  }
  .progress-sticky[data-fire="on"] .progress-label span{
    background: rgba(6,20,23, calc(.1 + .68 * var(--heat, 0))); padding: 1px 9px; border-radius: 999px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .progress-sticky[data-fire="on"] #progress-percent{
    color:#ffc266; font-weight:800;
    text-shadow: 0 0 calc(3px + 14px * var(--heat, 0)) rgba(255,110,20,.95), 0 1px 3px rgba(0,0,0,.6);
  }
  #progress-percent{ display:inline-block; transform-origin: right center; }

  /* ---- Lapisan efek (partikel, ring, konfeti) ---- */
  #fx-canvas{ position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:300; }
  .fx-float{
    position:fixed; z-index:310; pointer-events:none; font-weight:800; font-family: var(--font-display);
    text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space:nowrap;
  }
  .fx-ripple{
    position:absolute; border-radius:50%; pointer-events:none; background: rgba(255,255,255,.28);
    transform: scale(0); animation: fxRipple .6s ease-out forwards;
  }
  @keyframes fxRipple{ to{ transform: scale(1); opacity: 0; } }
  .fx-wash{ position:fixed; border-radius:50%; pointer-events:none; z-index:-4; }
  .fx-milestone{
    position:fixed; left:50%; top:26%; z-index:320; pointer-events:none; text-align:center;
    font-family: var(--font-display); font-weight:800; font-size:26px; color:#fff; white-space:nowrap;
    text-shadow: 0 0 12px rgba(255,140,30,.95), 0 0 30px rgba(255,80,0,.75), 0 3px 0 rgba(0,0,0,.35);
  }

  /* ---- Elemen yang menerima ripple ---- */
  .bar-btn, .add-item-btn, .add-category-btn, .install-banner-btn, .sheet-action,
  .category-head, .history-head, .toolbar-icon-btn{ position: relative; overflow: hidden; }

  /* ---- Efek tekan (active) ---- */
  .qty-btn{ transition: transform .12s ease, background .12s ease; }
  .qty-btn:active{ transform: scale(.75) rotate(-8deg); }
  .icon-btn svg, .bar-btn svg, .toolbar-icon-btn svg{ transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .icon-btn:active svg{ transform: rotate(-20deg) scale(.75); }
  .bar-btn:active svg{ transform: translateY(-4px) scale(1.25); }
  #more-btn svg circle{ transform-box: fill-box; transform-origin: center; }
  .add-item-btn:active, .add-category-btn:active{ transform: scale(.92); }
  .add-item-btn, .add-category-btn{ transition: transform .15s cubic-bezier(.34,1.56,.64,1); }
  .manage-toggle-btn{ transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .2s ease; }
  .manage-toggle-btn:active{ transform: scale(.9) rotate(-3deg); }
  .install-banner-btn:active{ transform: scale(.92); }

  /* ---- Fokus input: denyut sekali ---- */
  .trip-name-input:focus, .search-input:focus, .price-input:focus, .add-item-input:focus{ animation: focusPulse .6s ease-out; }
  @keyframes focusPulse{ 0%{ box-shadow: 0 0 0 0 var(--accent-soft, rgba(37,207,196,.4)); } 100%{ box-shadow: 0 0 0 14px transparent; } }

  /* ---- Lembar "Lainnya" dan popover filter: memantul ---- */
  .sheet{ transition: transform .5s cubic-bezier(.34,1.35,.64,1); }
  .sheet-backdrop.show .sheet-action{ animation: sheetItem .5s cubic-bezier(.34,1.56,.64,1) both; }
  .sheet-backdrop.show .sheet-action:nth-of-type(1){ animation-delay:.10s; }
  .sheet-backdrop.show .sheet-action:nth-of-type(2){ animation-delay:.17s; }
  .sheet-backdrop.show .sheet-action:nth-of-type(3){ animation-delay:.24s; }
  @keyframes sheetItem{ from{ opacity:0; transform: translateY(28px) scale(.94); } to{ opacity:1; transform:none; } }
  .filter-popover{ transform-origin: top right; transition: opacity .16s ease, transform .35s cubic-bezier(.34,1.56,.64,1); }
  .filter-popover.show .filter-option{ animation: optIn .4s cubic-bezier(.34,1.56,.64,1) both; }
  .filter-popover.show .filter-option:nth-child(2){ animation-delay:.07s; }
  @keyframes optIn{ from{ opacity:0; transform: translateX(18px); } to{ opacity:1; transform:none; } }
  .toast{ transition: opacity .2s ease, transform .45s cubic-bezier(.34,1.56,.64,1); }
  .edit-row{ animation: editPop .34s cubic-bezier(.34,1.56,.64,1); }
  @keyframes editPop{ from{ opacity:0; transform: scale(.9); } to{ opacity:1; transform:none; } }

  @media (prefers-reduced-motion: reduce){
    .sheet-backdrop.show .sheet-action, .filter-popover.show .filter-option, .edit-row,
    .trip-name-input:focus, .search-input:focus, .price-input:focus, .add-item-input:focus{ animation: none; }
  }
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

const QTY_MAX = 999;
function formatRupiah(val){
  const digits = String(val == null ? '' : val).replace(/[^0-9]/g, '');
  if(!digits) return '';
  return 'Rp ' + Number(digits).toLocaleString('id-ID');
}

function buildDefaultCategories(){
  return DEFAULT_DATA.map(cat => ({
    id: uid(),
    name: cat.name,
    items: cat.items.map(raw => {
      const optional = raw.startsWith('+');
      const name = optional ? raw.slice(1) : raw;
      return { id: uid(), name, optional, checked: false, qty: '', price: '' };
    })
  }));
}

let tripName = '';
let tripDate = '';
let tripType = 'privat'; // 'privat' | 'open'
let categories = [];
let collapsed = {};
let history = [];
let showOnlyUnchecked = false;
let hideOptional = false;

function loadState(){
  try{
    const raw = localStorage.getItem(CURRENT_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      tripName = parsed.tripName || '';
      tripDate = parsed.tripDate || '';
      tripType = parsed.tripType === 'open' ? 'open' : 'privat';
      categories = Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : buildDefaultCategories();
    } else {
      categories = buildDefaultCategories();
    }
  }catch(e){
    console.error('Gagal memuat data tersimpan, memakai default', e);
    categories = buildDefaultCategories();
  }
  try{
    const rawC = localStorage.getItem(COLLAPSE_KEY);
    collapsed = rawC ? JSON.parse(rawC) : {};
  }catch(e){ collapsed = {}; }
  try{
    const rawH = localStorage.getItem(HISTORY_KEY);
    history = rawH ? JSON.parse(rawH) : [];
  }catch(e){ history = []; }
}

function saveCurrent(){
  try{
    localStorage.setItem(CURRENT_KEY, JSON.stringify({ tripName, tripDate, tripType, categories }));
    flashSaved();
  }catch(e){
    showToast('Gagal menyimpan — penyimpanan penuh?');
  }
}
function saveCollapse(){
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }
  catch(e){ /* non-critical */ }
}
function saveHistory(){
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    flashSaved();
  }catch(e){
    showToast('Gagal menyimpan riwayat — penyimpanan penuh?');
  }
}

/* ================================================================
   ANIMASI & EFEK
   - FX      : partikel / ring / konfeti / animasi elemen (Web Animations API)
   - FireBar : api di progress bar, makin banyak dicentang makin besar
   ================================================================ */
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const FX = (() => {
  const canvas = document.createElement('canvas');
  canvas.id = 'fx-canvas';
  canvas.setAttribute('aria-hidden', 'true');
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let parts = [], running = false, lastT = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const NEON = ['#56e4a5', '#9dfbd2', '#25cfc4', '#ffffff', '#ffe066'];
  const CONFETTI = ['#ff5d8f', '#ffd166', '#56e4a5', '#25cfc4', '#a78bfa', '#ff8a3d', '#ffffff'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function starPath(r){
    ctx.beginPath();
    for(let i = 0; i < 8; i++){
      const rad = i % 2 === 0 ? r : r * 0.38;
      const a = i * Math.PI / 4 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
  }

  function start(){
    if(running) return;
    running = true; lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(t){
    const k = Math.max(0, Math.min(50, t - lastT)) / 16.667; lastT = t;
    ctx.clearRect(0, 0, W, H);
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.age += k;
      const tt = p.age / p.life;
      if(tt >= 1 || p.y > H + 60){ parts.splice(i, 1); continue; }
      const drag = Math.pow(p.drag, k);
      p.vx *= drag; p.vy *= drag; p.vy += p.g * k;
      p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;

      ctx.save();
      ctx.translate(p.x, p.y);
      if(p.type === 'spark'){
        ctx.rotate(p.rot);
        ctx.globalAlpha = 1 - Math.pow(tt, 2);
        ctx.fillStyle = p.color;
        const s = p.size * (1 - tt * 0.65);
        if(p.star){ starPath(s); ctx.fill(); } else { ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, 6.283); ctx.fill(); }
      } else if(p.type === 'confetti'){
        ctx.rotate(p.rot);
        ctx.globalAlpha = tt > 0.75 ? (1 - tt) / 0.25 : 1;
        ctx.fillStyle = p.color;
        ctx.scale(1, Math.cos(p.age * 0.18 + p.ph));
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if(p.type === 'smoke'){
        ctx.globalAlpha = 0.32 * (1 - tt);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, p.size * (1 + tt * 1.6), 0, 6.283); ctx.fill();
      } else if(p.type === 'ring'){
        const e = 1 - Math.pow(1 - tt, 3);
        ctx.globalAlpha = 1 - tt;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3.2 * (1 - tt) + 0.6;
        ctx.beginPath(); ctx.arc(0, 0, Math.max(0, p.size * e), 0, 6.283); ctx.stroke();
      }
      ctx.restore();
    }
    if(parts.length) requestAnimationFrame(loop); else running = false;
  }

  function add(p){ if(parts.length < 700){ parts.push(p); start(); } }

  function burst(x, y, o = {}){
    if(REDUCE_MOTION) return;
    const { count = 14, colors = NEON, speed = 5, star = true, gravity = 0.18 } = o;
    for(let i = 0; i < count; i++){
      const a = (i / count) * 6.283 + rnd(-0.25, 0.25), sp = rnd(0.5, 1) * speed;
      add({ type:'spark', x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 1, g:gravity, drag:0.955,
            life:rnd(28, 46), age:0, size:rnd(4, 8), color:pick(colors), rot:rnd(0, 6), vr:rnd(-0.2, 0.2), star: star && Math.random() < 0.65 });
    }
  }
  function ring(x, y, color = '#56e4a5', size = 34){
    if(REDUCE_MOTION) return;
    add({ type:'ring', x, y, vx:0, vy:0, g:0, drag:1, life:26, age:0, size, color, rot:0, vr:0 });
  }
  function poof(x, y, count = 6){
    if(REDUCE_MOTION) return;
    for(let i = 0; i < count; i++){
      add({ type:'smoke', x:x + rnd(-8, 8), y:y + rnd(-4, 4), vx:rnd(-0.6, 0.6), vy:rnd(-1.3, -0.4), g:-0.01, drag:0.97,
            life:rnd(28, 44), age:0, size:rnd(5, 9), color:pick(['#8fb4b2', '#b7cfcd', '#6f8d8b']), rot:0, vr:0 });
    }
  }
  function cannon(x, y, angleDeg, count = 60, power = 15){
    if(REDUCE_MOTION) return;
    for(let i = 0; i < count; i++){
      const a = (angleDeg + rnd(-24, 24)) * Math.PI / 180, sp = rnd(0.45, 1) * power;
      add({ type:'confetti', x, y, vx:Math.cos(a) * sp, vy:-Math.sin(a) * sp, g:0.27, drag:0.982,
            life:rnd(110, 180), age:0, size:rnd(7, 12), color:pick(CONFETTI), rot:rnd(0, 6), vr:rnd(-0.25, 0.25), ph:rnd(0, 6) });
    }
  }

  /* ---------- Helper DOM ---------- */
  function center(el){
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r };
  }
  function floatText(x, y, text, o = {}){
    if(REDUCE_MOTION) return;
    const { color = '#56e4a5', dy = -38, size = 15 } = o;
    const el = document.createElement('div');
    el.className = 'fx-float'; el.textContent = text;
    el.style.cssText = `left:${x}px;top:${y}px;color:${color};font-size:${size}px;`;
    document.body.appendChild(el);
    const a = el.animate([
      { opacity:0, transform:'translate(-50%,-50%) scale(.4)' },
      { opacity:1, transform:`translate(-50%,calc(-50% + ${dy * 0.35}px)) scale(1.3)`, offset:.25 },
      { opacity:0, transform:`translate(-50%,calc(-50% + ${dy}px)) scale(1)` }
    ], { duration: 780, easing: 'cubic-bezier(.2,.7,.3,1)' });
    a.onfinish = () => el.remove();
  }
  function ripple(el, cx, cy, color){
    if(REDUCE_MOTION) return;
    const r = el.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2.2;
    const sp = document.createElement('span');
    sp.className = 'fx-ripple';
    sp.style.cssText = `width:${size}px;height:${size}px;left:${cx - r.left - size / 2}px;top:${cy - r.top - size / 2}px;` + (color ? `background:${color};` : '');
    el.appendChild(sp);
    setTimeout(() => sp.remove(), 650);
  }
  function wash(x, y, color){
    if(REDUCE_MOTION) return;
    const R = Math.hypot(Math.max(x, W - x), Math.max(y, H - y));
    const el = document.createElement('div');
    el.className = 'fx-wash';
    el.style.cssText = `left:${x - R}px;top:${y - R}px;width:${R * 2}px;height:${R * 2}px;background:radial-gradient(circle, ${color} 0%, transparent 70%);`;
    document.body.appendChild(el);
    const a = el.animate([{ transform:'scale(0)', opacity:.7 }, { transform:'scale(1)', opacity:0 }], { duration: 950, easing: 'cubic-bezier(.2,.6,.3,1)' });
    a.onfinish = () => el.remove();
  }
  const vib = (ms) => { try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} };

  /* ---------- Efek per interaksi ---------- */
  // Centang: ring + bintang meledak + tanda centang membal + baris menyala
  function checkOn(wrap, row){
    if(REDUCE_MOTION) return;
    const c = center(wrap);
    ring(c.x, c.y, '#56e4a5', 32);
    burst(c.x, c.y, { count: 16, speed: 5.5 });
    const mark = wrap.querySelector('.checkmark');
    if(mark) mark.animate([
      { transform:'scale(.55) rotate(-25deg)' },
      { transform:'scale(1.4) rotate(10deg)', offset:.45 },
      { transform:'scale(.95) rotate(-3deg)', offset:.75 },
      { transform:'scale(1) rotate(0)' }
    ], { duration: 520, easing: 'ease-out' });
    row.animate([{ backgroundColor:'rgba(86,228,165,.30)' }, { backgroundColor:'rgba(86,228,165,0)' }], { duration: 800, easing: 'ease-out' });
    const nm = row.querySelector('.item-name');
    if(nm) nm.animate([{ transform:'translateX(-8px)', opacity:.35 }, { transform:'translateX(4px)', offset:.6 }, { transform:'none', opacity:1 }], { duration: 440, easing: 'ease-out' });
    vib(12);
  }
  // Lepas centang: kotak bergetar + kepulan asap
  function checkOff(wrap, row){
    if(REDUCE_MOTION) return;
    const c = center(wrap);
    poof(c.x, c.y, 5);
    const mark = wrap.querySelector('.checkmark');
    if(mark) mark.animate([
      { transform:'translateX(0) rotate(0)' }, { transform:'translateX(-5px) rotate(-10deg)' },
      { transform:'translateX(5px) rotate(10deg)' }, { transform:'translateX(-3px) rotate(-5deg)' }, { transform:'none' }
    ], { duration: 360, easing: 'ease-in-out' });
    const nm = row.querySelector('.item-name');
    if(nm) nm.animate([{ opacity:.4, transform:'translateX(10px)' }, { opacity:1, transform:'none' }], { duration: 320, easing: 'ease-out' });
  }
  // Jumlah: angka memantul, teks "+1" naik / "−1" jatuh
  function qty(btn, dir, blocked){
    if(REDUCE_MOTION) return;
    const st = btn.closest('.qty-stepper');
    const val = st && st.querySelector('.qty-val');
    const c = center(btn);
    if(blocked){
      (val || btn).animate([{ transform:'translateX(0)' }, { transform:'translateX(-5px)' }, { transform:'translateX(5px)' }, { transform:'translateX(-3px)' }, { transform:'none' }], { duration: 320 });
      floatText(c.x, c.y - 8, dir > 0 ? 'MAX' : '0', { color:'#ff8a80', size:12 });
      return;
    }
    if(dir > 0){
      if(val) val.animate([
        { transform:'translateY(12px) scale(.5)', opacity:.2, color:'#56e4a5' },
        { transform:'translateY(-5px) scale(1.5)', color:'#56e4a5', offset:.5 },
        { transform:'none' }
      ], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' });
      floatText(c.x, c.y - 14, '+1', { color:'#56e4a5', dy:-34 });
      burst(c.x, c.y, { count: 6, speed: 3, star: false, colors: ['#56e4a5', '#ffffff'] });
    } else {
      if(val) val.animate([
        { transform:'translateY(-10px) scale(.6)', opacity:.2, color:'#ff8a80' },
        { transform:'translateY(4px) scale(.8) rotate(-10deg)', offset:.45 },
        { transform:'translateX(3px)', offset:.7 },
        { transform:'none' }
      ], { duration: 420, easing: 'ease-out' });
      floatText(c.x, c.y + 6, '−1', { color:'#ff8a80', dy:30 });
    }
  }
  // Kategori dibuka / ditutup: kartu bergoyang seperti jeli
  function jelly(el){
    if(REDUCE_MOTION || !el) return;
    el.animate([
      { transform:'scale(1,1)' }, { transform:'scale(1.035,.955)', offset:.22 }, { transform:'scale(.98,1.03)', offset:.5 },
      { transform:'scale(1.01,.99)', offset:.75 }, { transform:'scale(1,1)' }
    ], { duration: 520, easing: 'ease-out' });
  }
  // Ganti Privat/Open: ombak warna tema + ikon beraksi
  function tripSwitch(type, cx, cy){
    if(REDUCE_MOTION) return;
    const label = document.querySelector(`label[for="trip-type-${type}"]`);
    if(!label) return;
    const cs = getComputedStyle(document.body);
    const glow = cs.getPropertyValue('--glow-1').trim() || 'rgba(37,207,196,.45)';
    const accent = cs.getPropertyValue('--accent').trim() || '#25cfc4';
    const c = center(label);
    wash(cx || c.x, cy || c.y, glow);
    ring(c.x, c.y, accent, 46);
    burst(c.x, c.y, { count: 10, speed: 4, colors: [accent, '#ffffff'] });
    const svg = label.querySelector('svg');
    if(!svg) return;
    if(type === 'privat'){
      svg.animate([
        { transform:'rotate(0)' }, { transform:'rotate(-24deg) scale(1.35)' }, { transform:'rotate(18deg) scale(1.2)' },
        { transform:'rotate(-8deg)' }, { transform:'rotate(0)' }
      ], { duration: 520, easing: 'ease-in-out' });
    } else {
      svg.animate([
        { transform:'rotate(0) scale(1)' }, { transform:'rotate(360deg) scale(1.5)', offset:.6 }, { transform:'rotate(360deg) scale(1)' }
      ], { duration: 720, easing: 'cubic-bezier(.3,.7,.3,1)' });
    }
  }
  // Ganti tab: konten meluncur dari samping
  function slideMain(dir){
    if(REDUCE_MOTION) return;
    const m = document.getElementById('main');
    if(m) m.animate([{ opacity:0, transform:`translateX(${dir * 46}px)` }, { opacity:1, transform:'none' }], { duration: 420, easing: 'cubic-bezier(.2,.85,.25,1)' });
  }
  // Filter: kartu kategori naik bergantian
  function stagger(){
    if(REDUCE_MOTION) return;
    const cats = [...document.querySelectorAll('#main .category')].filter(c => c.style.display !== 'none');
    cats.forEach((c, i) => c.animate([
      { opacity:0, transform:'translateY(22px) scale(.96)' }, { opacity:1, transform:'none' }
    ], { duration: 420, delay: Math.min(i, 8) * 45, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' }));
  }
  function funnel(btn){
    if(REDUCE_MOTION) return;
    const svg = btn.querySelector('svg');
    if(svg) svg.animate([
      { transform:'rotate(0) scale(1)' }, { transform:'rotate(-22deg) scale(1.25)' }, { transform:'rotate(16deg) scale(1.15)' },
      { transform:'rotate(-6deg)' }, { transform:'none' }
    ], { duration: 480, easing: 'ease-in-out' });
  }
  function spin(btn, deg){
    if(REDUCE_MOTION) return;
    const svg = btn.querySelector('svg');
    if(svg) svg.animate([{ transform:'rotate(0)' }, { transform:`rotate(${deg}deg)` }], { duration: 750, easing: 'cubic-bezier(.3,.7,.2,1)' });
  }
  function dots(btn){
    if(REDUCE_MOTION) return;
    btn.querySelectorAll('svg circle').forEach((c, i) => c.animate([
      { transform:'translateY(0) scale(1)' }, { transform:'translateY(-7px) scale(1.6)' }, { transform:'translateY(0) scale(1)' }
    ], { duration: 480, delay: i * 90, easing: 'ease-out' }));
  }
  function shake(el){
    if(REDUCE_MOTION || !el) return;
    el.animate([
      { transform:'translateX(0)' }, { transform:'translateX(-7px)' }, { transform:'translateX(6px)' },
      { transform:'translateX(-4px)' }, { transform:'translateX(2px)' }, { transform:'none' }
    ], { duration: 420, easing: 'ease-out' });
  }
  // Reset: semua centang jadi asap
  function resetBurst(){
    if(REDUCE_MOTION) return;
    let n = 0;
    document.querySelectorAll('input[data-check]:checked').forEach(inp => {
      if(n >= 28) return;
      const c = center(inp.closest('.checkbox-wrapper') || inp);
      if(c.y < 0 || c.y > H) return;
      poof(c.x, c.y, 3); n++;
    });
  }
  // Selesai: dua meriam konfeti dari bawah
  function finishCannons(){
    if(REDUCE_MOTION) return;
    cannon(W * 0.08, H, 68, 70, 17);
    cannon(W * 0.92, H, 112, 70, 17);
    setTimeout(() => { cannon(W * 0.5, H, 90, 60, 19); }, 220);
    vib([30, 40, 60]);
  }
  // Barang baru: meluncur masuk
  function dropIn(el){
    if(REDUCE_MOTION || !el) return;
    el.animate([
      { opacity:0, transform:'translateX(-40px) scale(.92)', backgroundColor:'rgba(37,207,196,.35)' },
      { opacity:1, transform:'translateX(8px) scale(1.02)', offset:.6 },
      { opacity:1, transform:'none', backgroundColor:'rgba(37,207,196,0)' }
    ], { duration: 620, easing: 'ease-out' });
  }
  // Kategori baru: jatuh dari atas
  function dropCard(el){
    if(REDUCE_MOTION || !el) return;
    el.animate([
      { opacity:0, transform:'translateY(-34px) scale(.9) rotate(-2deg)' },
      { opacity:1, transform:'translateY(6px) scale(1.02) rotate(.5deg)', offset:.6 },
      { opacity:1, transform:'none' }
    ], { duration: 560, easing: 'ease-out' });
  }
  // Tombol hapus muncul satu per satu
  function popIn(els){
    if(REDUCE_MOTION) return;
    [...els].forEach((el, i) => el.animate([
      { transform:'scale(0) rotate(-90deg)', opacity:0 }, { transform:'scale(1.3) rotate(10deg)', opacity:1, offset:.6 }, { transform:'none', opacity:1 }
    ], { duration: 420, delay: Math.min(i, 12) * 30, fill: 'backwards', easing: 'ease-out' }));
  }
  // Hapus: baris terlempar ke kanan lalu menutup
  function rowOut(el){
    if(REDUCE_MOTION || !el || !el.animate) return Promise.resolve();
    const h = el.offsetHeight, c = center(el);
    poof(c.x, c.y, 6);
    el.style.overflow = 'hidden';
    const a = el.animate([
      { opacity:1, transform:'translateX(0) rotate(0)', height:h + 'px' },
      { opacity:0, transform:'translateX(90px) rotate(4deg)', height:h + 'px', offset:.55 },
      { opacity:0, transform:'translateX(90px) rotate(4deg)', height:'0px', paddingTop:'0px', paddingBottom:'0px', marginBottom:'0px' }
    ], { duration: 480, easing: 'ease-in-out', fill: 'forwards' });
    return a.finished.catch(() => {});
  }
  // Riwayat dibuka: isi melebar, baris muncul bergantian
  function histOpen(id){
    if(REDUCE_MOTION) return;
    const btn = document.querySelector(`[data-hist-pdf="${CSS.escape(id)}"]`);
    if(!btn) return;
    const card = btn.closest('.history-card');
    const body = card && card.querySelector('.history-body');
    if(!body || !card.classList.contains('open')) return;
    const h = body.scrollHeight;
    body.style.overflow = 'hidden';
    const a = body.animate([{ height:'0px', opacity:0 }, { height:h + 'px', opacity:1 }], { duration: 340, easing: 'cubic-bezier(.2,.9,.3,1)' });
    a.onfinish = () => { body.style.overflow = ''; };
    body.querySelectorAll('.history-item').forEach((it, i) => it.animate([
      { opacity:0, transform:'translateX(-14px)' }, { opacity:1, transform:'none' }
    ], { duration: 300, delay: Math.min(i, 14) * 28, fill: 'backwards', easing: 'ease-out' }));
  }
  // Teks besar saat mencapai 25 / 50 / 75 / 100 persen
  function milestone(text){
    if(REDUCE_MOTION) return;
    const el = document.createElement('div');
    el.className = 'fx-milestone'; el.textContent = text;
    document.body.appendChild(el);
    const a = el.animate([
      { opacity:0, transform:'translate(-50%,-30%) scale(.4)' },
      { opacity:1, transform:'translate(-50%,-50%) scale(1.18)', offset:.22 },
      { opacity:1, transform:'translate(-50%,-50%) scale(1)', offset:.75 },
      { opacity:0, transform:'translate(-50%,-95%) scale(1)' }
    ], { duration: 1900, easing: 'ease-out' });
    a.onfinish = () => el.remove();
  }
  function ringAt(el, color){
    if(REDUCE_MOTION || !el) return;
    const c = center(el);
    ring(c.x, c.y, color || '#56e4a5', 26);
    burst(c.x, c.y, { count: 8, speed: 3.2 });
  }
  function burstAt(el, o){ if(el){ const c = center(el); burst(c.x, c.y, o); } }

  const MILESTONES = [
    [25, 'Mulai panas! 🔥'], [50, 'Setengah jalan! 🔥🔥'], [75, 'Hampir siap! 🔥🔥🔥'], [100, 'SEMUA SIAP! 🚀']
  ];
  function checkMilestone(before, after){
    const pct = (t) => t.totalItems ? Math.round(t.checkedItems / t.totalItems * 100) : 0;
    const a = pct(before), b = pct(after);
    let hit = null;
    MILESTONES.forEach(m => { if(a < m[0] && b >= m[0]) hit = m; });
    if(!hit) return;
    milestone(hit[1]);
    FireBar.flare(hit[0] === 100 ? 2 : 1.5);
    if(hit[0] === 100) finishCannons();
    else vib(30);
  }

  return { burst, ring, poof, cannon, ripple, wash, floatText, checkOn, checkOff, qty, jelly, tripSwitch, slideMain,
           stagger, funnel, spin, dots, shake, resetBurst, finishCannons, dropIn, dropCard, popIn, rowOut, histOpen,
           milestone, ringAt, burstAt, checkMilestone };
})();

const FireBar = (() => {
  const canvas = document.getElementById('fire-canvas');
  if(!canvas) return { set(){}, flare(){} };
  const box = canvas.closest('.progress-sticky');
  const ctx = canvas.getContext('2d');
  const CH = 64;                    // tinggi canvas (px CSS), sama dengan CSS
  let W = 0, DPR = 1;
  let heat = 0, target = 0, frac = 0, fracTarget = 0, boost = 0, hEff = 0;
  let parts = [], running = false, lastT = 0, lastCount = null, lastVar = -1;

  /* Sprite api: 24 tahap warna (putih-kuning -> oranye -> merah -> gelap) */
  const STAGES = 24, sprites = [];
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function ramp(t){
    const stops = [[0, [255, 246, 205]], [.18, [255, 214, 80]], [.42, [255, 140, 24]], [.7, [224, 52, 6]], [1, [110, 12, 0]]];
    for(let i = 1; i < stops.length; i++){
      if(t <= stops[i][0]){
        const a = stops[i - 1], b = stops[i], u = (t - a[0]) / (b[0] - a[0]);
        return [0, 1, 2].map(j => Math.round(lerp(a[1][j], b[1][j], u)));
      }
    }
    return stops[stops.length - 1][1];
  }
  for(let s = 0; s < STAGES; s++){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), [r, gg, b] = ramp(s / (STAGES - 1));
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, `rgba(${r},${gg},${b},1)`);
    grad.addColorStop(.35, `rgba(${r},${gg},${b},.6)`);
    grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    sprites.push(c);
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth;
    W = w;
    canvas.width = Math.round(w * DPR); canvas.height = Math.round(CH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  if('ResizeObserver' in window){
    new ResizeObserver(() => { resize(); if(W > 0 && (target > 0 || parts.length)) start(); }).observe(canvas);
  }

  function setVar(v){
    if(box && Math.abs(v - lastVar) > 0.02){ box.style.setProperty('--heat', v.toFixed(2)); lastVar = v; }
  }
  function start(){
    if(running || REDUCE_MOTION) return;
    if(!W) resize();
    if(W <= 0) return;
    running = true; lastT = performance.now();
    requestAnimationFrame(frame);
  }

  function addFlame(x, scale){
    if(parts.length > 430) return;
    const life = rnd(24, 38) + 16 * hEff;
    const rise = Math.min(CH - 14, (9 + 40 * hEff) * rnd(.7, 1.3) * scale);
    parts.push({ kind:0, x, y:CH - 5 - rnd(0, 2), vx:rnd(-.25, .25), vy:rise / (0.7 * life), life, age:0,
                 size:(2.4 + 6.5 * hEff) * rnd(.75, 1.25) * (scale > 1 ? 1.2 : 1), ph:rnd(0, 6.28) });
  }
  function addEmber(x){
    parts.push({ kind:1, x, y:CH - 6, vx:rnd(-.7, .7), vy:rnd(.5, 1.1) * (hEff + .5), life:rnd(40, 80), age:0, size:2, ph:rnd(0, 6.28) });
  }
  const whole = (n) => Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);

  function spawn(k){
    const fw = frac * W;
    if(fw < 2) return;
    const body = whole((fw / 105) * (0.3 + 0.7 * hEff) * k);
    for(let i = 0; i < body; i++) addFlame(rnd(2, fw), 1);
    const head = whole((0.5 + 1.7 * hEff) * k);
    for(let i = 0; i < head; i++) addFlame(Math.max(2, Math.min(W - 2, fw + rnd(-3, 3))), 1.35);
    if(hEff > .45 && Math.random() < (hEff - .35) * .35 * k) addEmber(rnd(2, fw));
  }

  function frame(t){
    if(!running) return;
    if(W <= 0){ running = false; return; }
    const k = Math.max(0, Math.min(48, t - lastT)) / 16.667; lastT = t;
    heat += (target - heat) * (1 - Math.pow(.92, k));
    frac += (fracTarget - frac) * (1 - Math.pow(.86, k));
    boost *= Math.pow(.94, k); if(boost < .01) boost = 0;
    hEff = Math.min(1.4, heat + .28 * boost);
    setVar(hEff);
    if(target > 0 && heat > .01) spawn(k);

    ctx.clearRect(0, 0, W, CH);
    ctx.globalCompositeOperation = 'lighter';
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.age += k;
      const tt = p.age / p.life;
      if(tt >= 1 || p.y < -4){ parts.splice(i, 1); continue; }
      if(p.kind === 0){
        p.y -= p.vy * (1 - .6 * tt) * k;
        p.x += (p.vx + Math.sin(p.age * .22 + p.ph) * .35) * k;
        const r = p.size * (1.25 - .85 * tt);
        const a = (tt < .12 ? tt / .12 : 1 - Math.pow((tt - .12) / .88, 1.4)) * .75 * Math.min(1, p.y / 16);
        ctx.globalAlpha = Math.max(0, a);
        ctx.drawImage(sprites[Math.min(STAGES - 1, Math.floor(tt * STAGES))], p.x - r * 1.6, p.y - r * 1.6, r * 3.2, r * 3.2);
      } else {
        p.y -= p.vy * k; p.x += (p.vx + Math.sin(p.age * .3 + p.ph) * .3) * k;
        ctx.globalAlpha = Math.max(0, (1 - tt) * .9);
        ctx.fillStyle = '#ffd778';
        ctx.fillRect(p.x, p.y, 2, 2);
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    if(target === 0 && heat < .01 && parts.length === 0){ running = false; setVar(0); return; }
    requestAnimationFrame(frame);
  }

  /* Dipanggil setiap progress berubah. Makin banyak dicentang, makin besar apinya. */
  function set(checked, total){
    const ratio = total > 0 ? checked / total : 0;
    fracTarget = ratio;
    target = checked === 0 ? 0 : 0.1 + 0.9 * Math.pow(ratio, 0.7);
    if(box) box.dataset.fire = checked > 0 ? 'on' : 'off';
    if(lastCount !== null && checked > lastCount) boost = Math.max(boost, 1);
    lastCount = checked;
    if(REDUCE_MOTION){ setVar(target); return; }
    start();
  }
  function flare(power){ boost = Math.max(boost, power || 1); start(); }

  return { set, flare };
})();

/* ---------- MAIN RENDER DISPATCH ---------- */
function render(){
  // Preserve scroll position across re-renders (fixes "jump to top" on checkbox tap etc.)
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;

  document.getElementById('tab-checklist').checked = activeTab === 'checklist';
  document.getElementById('tab-history').checked = activeTab === 'history';
  document.getElementById('checklist-header-extra').style.display = activeTab === 'checklist' ? '' : 'none';
  document.getElementById('scroll-top-panel').style.display = activeTab === 'checklist' ? '' : 'none';
  document.getElementById('bottom-bar-checklist').style.display = activeTab === 'checklist' ? 'flex' : 'none';
  document.getElementById('progress-sticky').style.display = activeTab === 'checklist' ? 'block' : 'none';

  const histLabel = document.getElementById('history-count-label');
  if(activeTab === 'history'){
    histLabel.style.display = '';
    histLabel.textContent = `${history.length} checklist tersimpan di riwayat`;
  } else {
    histLabel.style.display = 'none';
  }

  if(activeTab === 'checklist') renderChecklist();
  else renderHistory();

  // Restore scroll position after DOM has been rebuilt.
  window.scrollTo(scrollX, scrollY);
}

/* ---------- CHECKLIST VIEW ---------- */
const mainEl = document.getElementById('main');

function computeTotals(){
  let totalItems = 0, checkedItems = 0, totalPrice = 0;
  categories.forEach(cat => {
    const visibleForCountItems = hideOptional ? cat.items.filter(i => !i.optional) : cat.items;
    visibleForCountItems.forEach(it => { totalItems++; if(it.checked) checkedItems++; });
    cat.items.forEach(it => { if(it.checked && it.price){ totalPrice += Number(it.price) || 0; } });
  });
  return { totalItems, checkedItems, totalPrice };
}

function updateProgressBar(){
  const { totalItems, checkedItems, totalPrice } = computeTotals();
  document.getElementById('progress-text').textContent = `${checkedItems} dari ${totalItems} dikumpulkan`;
  const pct = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
  const pctEl = document.getElementById('progress-percent');
  const pctChanged = pctEl.textContent !== (pct + '%');
  pctEl.textContent = pct + '%';
  if(pctChanged && !REDUCE_MOTION && pctEl.animate){
    pctEl.animate([{ transform:'scale(1)' }, { transform:'scale(1.55)', offset:.4 }, { transform:'scale(1)' }], { duration: 380, easing: 'ease-out' });
  }
  document.getElementById('progress-fill').style.width = pct + '%';
  FireBar.set(checkedItems, totalItems);
  const totalPriceEl = document.getElementById('progress-total-price');
  if(totalPriceEl) totalPriceEl.textContent = totalPrice > 0 ? `Total: ${formatRupiah(totalPrice)}` : '';
}

function renderChecklist(){
  mainEl.innerHTML = '';

  categories.forEach(cat => {
    const visibleForCountItems = hideOptional ? cat.items.filter(i => !i.optional) : cat.items;

    const catEl = document.createElement('section');
    catEl.className = 'category' + (collapsed[cat.id] ? ' collapsed' : '');
    catEl.dataset.catId = cat.id;

    if(editingCatId === cat.id){
      const head = document.createElement('div');
      head.className = 'category-head';
      head.style.cursor = 'default';
      head.innerHTML = `
        <div class="edit-row">
          <input type="text" value="${escapeHTML(cat.name)}" data-cat-edit-input>
          <button class="edit-save" data-cat-save>Simpan</button>
          <button class="edit-cancel" data-cat-cancel>Batal</button>
        </div>`;
      catEl.appendChild(head);
      mainEl.appendChild(catEl);

      const input = head.querySelector('[data-cat-edit-input]');
      head.querySelector('[data-cat-save]').addEventListener('click', () => {
        const val = input.value.trim();
        if(val){ cat.name = val; saveCurrent(); }
        editingCatId = null;
        render();
      });
      head.querySelector('[data-cat-cancel]').addEventListener('click', () => {
        editingCatId = null;
        render();
      });
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); head.querySelector('[data-cat-save]').click(); }
        if(e.key === 'Escape'){ e.preventDefault(); head.querySelector('[data-cat-cancel]').click(); }
      });
      setTimeout(() => { input.focus(); input.select(); }, 0);
      return;
    }

    const catCheckedVisible = visibleForCountItems.filter(i => i.checked).length;

    const head = document.createElement('button');
    head.className = 'category-head';
    head.dataset.toggleCat = cat.id;
    head.innerHTML = `
      <div class="category-head-left">
        <span class="category-name">${escapeHTML(cat.name)}</span>
        <span class="category-count">${catCheckedVisible}/${visibleForCountItems.length}</span>
      </div>
      <div class="category-head-actions">
        <span class="manage-toggle-btn${manageMode[cat.id] ? ' active' : ''}" data-manage-toggle="${cat.id}">${manageMode[cat.id] ? 'Selesai' : 'Hapus item'}</span>
        <span class="icon-btn" data-cat-edit="${cat.id}" title="Edit kategori">${editSVG()}</span>
        <span class="icon-btn danger-hover" data-cat-delete="${cat.id}" title="Hapus kategori">${trashSVG()}</span>
      </div>
    `;
    catEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'category-body';
    const itemsList = document.createElement('div');
    itemsList.className = 'items-list';

    let visibleCount = 0;

    cat.items.forEach(item => {
      if(hideOptional && item.optional) return;

      const matchesSearch = searchQuery === '' || item.name.toLowerCase().includes(searchQuery);
      const matchesFilter = !showOnlyUnchecked || !item.checked;
      const visible = matchesSearch && matchesFilter;
      if(visible) visibleCount++;

      const itemKey = cat.id + ':' + item.id;

      if(editingItemKey === itemKey){
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <div class="edit-row">
            <input type="text" value="${escapeHTML(item.name)}" data-item-edit-input>
            <button class="edit-save" data-item-save>Simpan</button>
            <button class="edit-cancel" data-item-cancel>Batal</button>
          </div>`;
        itemsList.appendChild(row);
        const input = row.querySelector('[data-item-edit-input]');
        row.querySelector('[data-item-save]').addEventListener('click', () => {
          const val = input.value.trim();
          if(val){ item.name = val; saveCurrent(); }
          editingItemKey = null;
          render();
        });
        row.querySelector('[data-item-cancel]').addEventListener('click', () => {
          editingItemKey = null;
          render();
        });
        input.addEventListener('keydown', (e) => {
          if(e.key === 'Enter'){ e.preventDefault(); row.querySelector('[data-item-save]').click(); }
          if(e.key === 'Escape'){ e.preventDefault(); row.querySelector('[data-item-cancel]').click(); }
        });
        setTimeout(() => { input.focus(); input.select(); }, 0);
        return;
      }

      const row = document.createElement('div');
      row.className = 'item' + (item.checked ? ' checked' : '') + (visible ? '' : ' hidden');
      row.dataset.itemId = item.id;
      const qtyVal = item.qty ? Number(item.qty) : 0;
      row.innerHTML = `
        <div class="item-row-main">
          <label class="checkbox-wrapper">
            <input type="checkbox" data-check="${itemKey}" ${item.checked ? 'checked' : ''} aria-label="Tandai ${escapeHTML(item.name)}" />
            <span class="checkmark">${checkIconSVG()}</span>
          </label>
          <span class="item-name" data-edit-name="${itemKey}">${escapeHTML(item.name)}${item.optional ? '<span class="plus-tag">+</span>' : ''}</span>
          <div class="qty-stepper">
            <span class="qty-btn" data-qty-dec="${itemKey}" aria-label="Kurangi jumlah">−</span>
            <span class="qty-val">${qtyVal}</span>
            <span class="qty-btn" data-qty-inc="${itemKey}" aria-label="Tambah jumlah">+</span>
          </div>
          ${manageMode[cat.id] ? `<span class="icon-btn danger-hover item-manage-delete" data-remove="${itemKey}" title="Hapus">${trashSVG()}</span>` : ''}
        </div>
        ${item.checked && qtyVal > 0 ? `
        <div class="item-row-price">
          <label for="price-${itemKey}">Harga</label>
          <input type="text" inputmode="numeric" class="price-input" id="price-${itemKey}" data-price="${itemKey}" value="${formatRupiah(item.price)}" placeholder="Rp 0">
        </div>` : ''}
      `;
      itemsList.appendChild(row);
    });

    if(itemsList.children.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = 'Belum ada item.';
      itemsList.appendChild(empty);
    }

    body.appendChild(itemsList);

    const addRow = document.createElement('div');
    addRow.className = 'add-item-row';
    addRow.innerHTML = `
      <input type="text" class="add-item-input" placeholder="Tambah barang…" data-add-item="${cat.id}">
      <button class="add-item-btn" data-add-item-btn="${cat.id}">+ Tambah</button>
    `;
    body.appendChild(addRow);

    catEl.appendChild(body);

    if(visibleCount === 0 && (searchQuery !== '' || showOnlyUnchecked)){
      catEl.style.display = 'none';
    } else {
      catEl.style.display = '';
    }

    mainEl.appendChild(catEl);
  });

  const addCategoryBlock = document.createElement('div');
  addCategoryBlock.className = 'add-category';
  addCategoryBlock.innerHTML = `
    <input type="text" class="add-category-input" id="new-category-input" placeholder="Tambah kategori baru…">
    <button class="add-category-btn" id="new-category-btn">Tambah</button>
  `;
  mainEl.appendChild(addCategoryBlock);

  document.getElementById('new-category-btn').addEventListener('click', addNewCategory);
  document.getElementById('new-category-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addNewCategory();
  });

  updateProgressBar();
}

function findItem(catId, itemId){
  const cat = categories.find(c => c.id === catId);
  if(!cat) return null;
  const item = cat.items.find(i => i.id === itemId);
  return item ? { cat, item } : null;
}

// Update hanya bagian item yang berubah. Hindari membangun ulang seluruh <main>
// saat checkbox/qty disentuh agar posisi layar dan animasi CSS tetap stabil.
function updateItemRowDOM(catId, itemId){
  const found = findItem(catId, itemId);
  if(!found) return;

  const { cat, item } = found;
  const itemKey = catId + ':' + itemId;
  const row = mainEl.querySelector(`.item[data-item-id="${CSS.escape(itemId)}"]`);
  if(!row) return;

  const qtyVal = item.qty ? Number(item.qty) : 0;
  row.classList.toggle('checked', !!item.checked);

  const checkBtn = row.querySelector('[data-check]');
  if(checkBtn){
    checkBtn.setAttribute('aria-label', `Tandai ${escapeHTML(item.name)}`);
    checkBtn.checked = !!item.checked;
  }

  const qtyEl = row.querySelector('.qty-val');
  if(qtyEl) qtyEl.textContent = qtyVal;

  // Harga hanya muncul jika item dicentang dan qty > 0.
  const existingPrice = row.querySelector('.item-row-price');
  const shouldShowPrice = !!item.checked && qtyVal > 0;
  if(shouldShowPrice && !existingPrice){
    const priceWrap = document.createElement('div');
    priceWrap.className = 'item-row-price';
    priceWrap.innerHTML = `
      <label for="price-${itemKey}">Harga</label>
      <input type="text" inputmode="numeric" class="price-input" id="price-${itemKey}" data-price="${itemKey}" value="${formatRupiah(item.price)}" placeholder="Rp 0">`;
    row.appendChild(priceWrap);
  } else if(!shouldShowPrice && existingPrice){
    existingPrice.remove();
  } else if(existingPrice){
    const priceInput = existingPrice.querySelector('[data-price]');
    if(priceInput && document.activeElement !== priceInput){
      priceInput.value = formatRupiah(item.price);
    }
  }

  // Perbarui hitungan kategori tanpa render ulang.
  const head = mainEl.querySelector(`.category[data-cat-id="${CSS.escape(catId)}"] .category-head`);
  if(head){
    const visibleItems = hideOptional ? cat.items.filter(i => !i.optional) : cat.items;
    const checkedVisible = visibleItems.filter(i => i.checked).length;
    const countEl = head.querySelector('.category-count');
    if(countEl) countEl.textContent = `${checkedVisible}/${visibleItems.length}`;
  }

  updateProgressBar();
}

function addNewItem(catId){
  const input = mainEl.querySelector(`[data-add-item="${catId}"]`);
  const name = input.value.trim();
  if(!name) return;
  const cat = categories.find(c => c.id === catId);
  cat.items.push({ id: uid(), name, optional: false, checked: false, qty: '', price: '' });
  input.value = '';

/* Event delegation for checklist */
mainEl.addEventListener('click', (e) => {
  const toggleCatBtn = e.target.closest('[data-toggle-cat]');
  if(toggleCatBtn && !e.target.closest('[data-cat-edit]') && !e.target.closest('[data-cat-delete]') && !e.target.closest('[data-manage-toggle]')){
    const catId = toggleCatBtn.dataset.toggleCat;
    collapsed[catId] = !collapsed[catId];
    saveCollapse();
    const catSection = toggleCatBtn.closest('.category');
    if(catSection){ catSection.classList.toggle('collapsed', !!collapsed[catId]); FX.jelly(catSection); }
    return;
  }

  const manageToggleBtn = e.target.closest('[data-manage-toggle]');
  if(manageToggleBtn){
    const catId = manageToggleBtn.dataset.manageToggle;
    manageMode[catId] = !manageMode[catId];
    render();
    if(manageMode[catId]) FX.popIn(mainEl.querySelectorAll(`.category[data-cat-id="${CSS.escape(catId)}"] .item-manage-delete`));
    return;
  }

  const catEditBtn = e.target.closest('[data-cat-edit]');
  if(catEditBtn){
    editingCatId = catEditBtn.dataset.catEdit;
    render();
    return;
  }

  const catDeleteBtn = e.target.closest('[data-cat-delete]');
  if(catDeleteBtn){
    const catId = catDeleteBtn.dataset.catDelete;
    const cat = categories.find(c => c.id === catId);
    if(cat && confirm(`Hapus kategori "${cat.name}" beserta semua itemnya?`)){
      FX.rowOut(catDeleteBtn.closest('.category')).then(() => {
        categories = categories.filter(c => c.id !== catId);
        saveCurrent();
        render();
      });
    }
    return;
  }

  const nameTap = e.target.closest('[data-edit-name]');
  if(nameTap){
    editingItemKey = nameTap.dataset.editName;
    render();
    return;
  }

  const qtyDecBtn = e.target.closest('[data-qty-dec]');
  if(qtyDecBtn){
    const [catId, itemId] = qtyDecBtn.dataset.qtyDec.split(':');
    const found = findItem(catId, itemId);
    if(found){
      let q = parseInt(found.item.qty, 10) || 0;
      const prevQ = q;
      q = Math.max(0, q - 1);
      found.item.qty = q ? String(q) : '';
      if(!q){ found.item.price = ''; }
      saveCurrent();
      updateItemRowDOM(catId, itemId);
      FX.qty(qtyDecBtn, -1, prevQ === 0);
    }
    return;
  }

  const qtyIncBtn = e.target.closest('[data-qty-inc]');
  if(qtyIncBtn){
    const [catId, itemId] = qtyIncBtn.dataset.qtyInc.split(':');
    const found = findItem(catId, itemId);
    if(found){
      let q = parseInt(found.item.qty, 10) || 0;
      const prevQ = q;
      q = Math.min(QTY_MAX, q + 1);
      found.item.qty = String(q);
      saveCurrent();
      updateItemRowDOM(catId, itemId);
      FX.qty(qtyIncBtn, 1, prevQ >= QTY_MAX);
    }
    return;
  }

  const removeBtn = e.target.closest('[data-remove]');
  if(removeBtn){
    const [catId, itemId] = removeBtn.dataset.remove.split(':');
    const cat = categories.find(c => c.id === catId);
    const item = cat && cat.items.find(i => i.id === itemId);
    if(cat && item && confirm(`Hapus "${item.name}"?`)){
      FX.rowOut(removeBtn.closest('.item')).then(() => {
        cat.items = cat.items.filter(i => i.id !== itemId);
        saveCurrent();
        render();
      });
    }
    return;
  }

  const addItemBtn = e.target.closest('[data-add-item-btn]');
  if(addItemBtn){ addNewItem(addItemBtn.dataset.addItemBtn); return; }
});

/* Neon checkbox: pakai event change (bukan click) supaya tidak terhitung dua kali via <label> */
mainEl.addEventListener('change', (e) => {
  const checkInput = e.target.closest('input[data-check]');
  if(!checkInput) return;
  const [catId, itemId] = checkInput.dataset.check.split(':');
  const found = findItem(catId, itemId);
  if(found){
    const before = computeTotals();
    found.item.checked = checkInput.checked;
    if(!found.item.checked){ found.item.qty = ''; found.item.price = ''; }
    saveCurrent();
    updateItemRowDOM(catId, itemId);
    const wrap = checkInput.closest('.checkbox-wrapper');
    const row = checkInput.closest('.item');
    if(found.item.checked){
      FX.checkOn(wrap, row);
      FX.checkMilestone(before, computeTotals());
    } else {
      FX.checkOff(wrap, row);
    }
  }
});
